
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To My Princess 🦄</title>

<style>
body {
    background-image: url("bk1.PNG");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    min-height: 100vh;
    overflow: hidden;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h2 {
    margin-bottom: 20px;
    text-shadow: 2px 2px 5px black;
}

/* Buttons */
button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 10px;
}

#yesBtn {
    background-color: #28a745;
    color: white;
}

#noBtn {
    background-color: #dc3545;
    color: white;
}

#buttons {
    position: relative;
}

/* Curved text container */
#earthContainer {
    display: none;
    position: relative;
    width: min(250vw, 600px);
    aspect-ratio: 1 / 1;
    transform: translateY(10px);
}

/* SVG curved text */
#curvedText {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
}

#curvedText text {
    fill: rgba(255, 255, 255, 0.75);
    font-size: 26px;
    font-family: Arial, sans-serif;
    font-weight: bold;

    stroke: rgba(0, 0, 0, 0.45);
    stroke-width: 1px;
    paint-order: stroke;

    filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.03));
}

@media (max-width: 420px) {
    #curvedText text {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<h2 id="message">Will you be my 💞❤️💙💚</h2>

<div id="buttons">
    <button id="yesBtn">Veeenz 🙈❤️💜</button>
    <button id="noBtn">Veena 🥰</button>
</div>

<!-- Curved love messages -->
<div id="earthContainer">

    <svg id="curvedText" viewBox="0 0 400 400">

        <defs>

            <!-- Upper circular text -->
            <path id="topCurve"
                  d="M 10,200 A 190,190 0 0,1 390,200"/>

            <!-- Lower circular text -->
            <path id="bottomCurve"
                  d="M 10,200 A 190,190 0 0,0 390,200"/>

        </defs>

        <text>
            <textPath href="#topCurve"
                      startOffset="50%"
                      text-anchor="middle">
                The only world of my life 🦄❤️
            </textPath>
        </text>

        <text>
            <textPath href="#bottomCurve"
                      startOffset="50%"
                      text-anchor="middle">
                Love you, Veena! 💕
            </textPath>
        </text>

    </svg>

</div>

<script>
const noBtn = document.getElementById("noBtn");

// Make Veena run away when cursor approaches
function moveButton() {
    const padding = 15;

    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;

    const x = padding + Math.random() * Math.max(0, maxX - padding);
    const y = padding + Math.random() * Math.max(0, maxY - padding);

    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("pointerenter", moveButton);

noBtn.addEventListener("touchstart", function(event) {
    event.preventDefault();
    moveButton();
}, { passive: false });

noBtn.addEventListener("click", function(event) {
    event.preventDefault();
    moveButton();
});

// When Veeenz clicks Yes
document.getElementById("yesBtn").addEventListener("click", function() {

    // Change background to Earth
    document.body.style.backgroundImage = 'url("bk2.PNG")';

    // Hide initial message
    document.getElementById("message").style.display = "none";

    // Hide buttons
    document.getElementById("yesBtn").style.display = "none";
    document.getElementById("noBtn").style.display = "none";

    // Show curved text around Earth
    document.getElementById("earthContainer").style.display = "block";

});
</script>

</body>
</html>
